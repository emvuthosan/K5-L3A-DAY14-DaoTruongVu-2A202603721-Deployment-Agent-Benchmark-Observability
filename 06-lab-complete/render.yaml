# ============================================================
# Cấu hình deploy Render — Blueprint (tiêu chí 12), có thể dùng thay railway.toml
#   • web service chạy bằng Docker, healthCheckPath = /health
#   • Redis managed, agent lấy REDIS_URL qua fromService
#   • Secret (AGENT_API_KEY) dùng generateValue → KHÔNG ghi thẳng giá trị
# ============================================================
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "30.0"
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString

  - type: redis
    name: agent-redis
    plan: free
    ipAllowList: []
