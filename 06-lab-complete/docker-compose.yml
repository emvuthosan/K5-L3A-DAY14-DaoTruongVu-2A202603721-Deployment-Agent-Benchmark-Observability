# ============================================================
# Agent + Redis bằng một lệnh `docker compose up` (tiêu chí 2)
#   • agent: build từ Dockerfile, map port 8000, đọc thêm .env (không bắt buộc)
#   • redis: redis:7-alpine, có healthcheck
#   • agent trỏ REDIS_URL tới service redis và depends_on nó
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: "10"
      DAILY_BUDGET_USD: "1.0"
      MONTHLY_BUDGET_USD: "30.0"
      # AGENT_API_KEY lấy từ .env / biến môi trường, KHÔNG hard-code ở đây
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
