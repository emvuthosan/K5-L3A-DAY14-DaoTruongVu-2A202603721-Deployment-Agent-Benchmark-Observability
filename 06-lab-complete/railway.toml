# ============================================================
# Cấu hình deploy Railway (tiêu chí 12)
#   • Build bằng Dockerfile có sẵn
#   • Healthcheck gọi /health
#   • App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile)
#   • Đặt AGENT_API_KEY / REDIS_URL bằng `railway variables set ...`, KHÔNG ghi ở đây
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
